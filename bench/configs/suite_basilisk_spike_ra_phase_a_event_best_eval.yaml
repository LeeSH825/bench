suite:
  name: basilisk_spike_ra_phase_a_event_best_eval
  version: "0.1.0"
  description: >
    Legacy Euclidean 6D-observation checkpoint-only re-evaluation of the
    best-validation checkpoints from the first SpikeRA CPU event-only Phase A
    comparison; this is not current right-local Phase 2 evidence. A clean clone
    must run suite_basilisk_spike_ra_phase_a_event.yaml first because the
    referenced checkpoints are runtime products and are not packaged.

seeds: [0]

tasks:
  - task_id: Basilisk_IMU_ADCS_event_spike_ra_phase_a_event_v0
    task_name: "Basilisk IMU ADCS Measurement Event SpikeRA Phase A"
    task_family: basilisk_imu_adcs_v0
    system_type: nonlinear
    x_dim: 6
    y_dim: 6
    sequence_length_T: 200
    dataset_sizes: {N_train: 100, N_val: 20, N_test: 20}
    simulation:
      dt: 0.1
      inertia: [10.0, 8.0, 6.0]
      disturbance_torque: [0.0, 0.0, 0.0]
      sigma0_std: 0.05
      sigma0_max_norm: 0.25
      omega0_std: 0.01
    noise:
      Q: {type: "scaled_identity", q2: 1.0e-8}
    observation:
      type: basilisk_imu_sensor
      h_type: imu_sensor_packet
      measurement_mode: gyro_delta_angle
    imu:
      measurement_mode: gyro_delta_angle
      gyro_noise_std: 2.0e-4
      accel_noise_std: 0.0
      gyro_bias_std: 0.0
      accel_bias_std: 0.0
      sensor_pos_B: [0.0, 0.0, 0.0]
      body_to_platform_euler321_rad: [0.0, 0.0, 0.0]
    event_disturbance:
      enabled: true
      event_start_frac: 0.45
      event_duration_frac: 0.10
      gyro_noise_scale_event: 10.0
      gyro_bias_jump_std: 0.01
      event_type: measurement_gyro_bias_jump
    control_input_u: false
    ground_truth: {has_gt: true}
    sweep: {}

models:
  # Every ckpt_path below is produced by the trained:frozen Phase A producer
  # suite and is intentionally absent from a clean clone/wheel.
  - model_id: kalmannet_tsp
    display_name: "KalmanNet_TSP"
    adapter: "bench.models.kalmannet_tsp:KalmanNetTSPAdapter"
    repo: {path: "third_party/KalmanNet_TSP"}
    estimator_class_path: "KNet.KalmanNet_nn.KalmanNetNN"
    ckpt_path: "runs/basilisk_spike_ra_phase_a_event/Basilisk_IMU_ADCS_event_spike_ra_phase_a_event_v0/kalmannet_tsp/frozen/seed_0/scenario_b93d070d887d/checkpoints/model.pt"
    input_layout: "BTD"
    eval_init_from_gt: false
    capabilities:
      supports_adaptation: false
      outputs_covariance: false
      needs_system_model: true

  - model_id: split_knet
    display_name: "Split-KalmanNet"
    adapter: "bench.models.split_knet:SplitKNetAdapter"
    repo: {path: "third_party/Split_KalmanNet"}
    estimator_class_path: "GSSFiltering.filtering.Split_KalmanNet_Filter"
    ckpt_path: "runs/basilisk_spike_ra_phase_a_event/Basilisk_IMU_ADCS_event_spike_ra_phase_a_event_v0/split_knet/frozen/seed_0/scenario_b93d070d887d/checkpoints/model.pt"
    input_layout: "BTD"
    eval_init_from_gt: false
    capabilities:
      supports_adaptation: false
      outputs_covariance: false
      needs_system_model: true

  - model_id: spike_split_knet
    display_name: "Spike-Split KalmanNet (G2-SNN)"
    adapter: "bench.models.spike_split_knet:SpikeSplitKNetAdapter"
    repo: {path: "third_party/Split_KalmanNet"}
    estimator_class_path: "GSSFiltering.filtering.Split_KalmanNet_Filter"
    ckpt_path: "runs/basilisk_spike_ra_phase_a_event/Basilisk_IMU_ADCS_event_spike_ra_phase_a_event_v0/spike_split_knet/frozen/seed_0/scenario_b93d070d887d/checkpoints/model.pt"
    input_layout: "BTD"
    eval_init_from_gt: false
    snn_enabled: true
    snn_target: g2
    snn_hidden_dim: 32
    lif_beta: 0.9
    lif_threshold: 1.0
    surrogate_alpha: 10.0
    capabilities:
      supports_adaptation: false
      outputs_covariance: false
      needs_system_model: true

  - model_id: spike_ra_knet
    display_name: "SpikeRA-KalmanNet"
    adapter: "bench.models.spike_ra_knet:SpikeRAKNetAdapter"
    repo: {path: "third_party/Split_KalmanNet"}
    estimator_class_path: "GSSFiltering.filtering.Split_KalmanNet_Filter"
    ckpt_path: "runs/basilisk_spike_ra_phase_a_event/Basilisk_IMU_ADCS_event_spike_ra_phase_a_event_v0/spike_ra_knet/frozen/seed_0/scenario_b93d070d887d/checkpoints/model.pt"
    input_layout: "BTD"
    eval_init_from_gt: false
    snn_hidden_dim: 32
    lif_beta: 0.9
    lif_threshold: 1.0
    surrogate_alpha: 10.0
    ra_max_suppression: 0.5
    ra_initial_alpha: 0.99
    capabilities:
      supports_adaptation: false
      outputs_covariance: false
      needs_system_model: true

runner:
  device: "cpu"
  precision: "fp32"
  deterministic: true
  enabled_policy:
    task_default: true
    model_default: true
    skip_if_disabled: true
  data_mode: "bench_generated"
  budget:
    train_max_updates: 0
    train_batch_size: 10
    eval_batch_size: 20
  tracks:
    - track_id: frozen
      adaptation_enabled: false

metrics:
  list: ["mse", "rmse", "mse_db", "timing_ms_per_step", "nll"]
  nll_policy:
    if_no_covariance: "NA"
  shift_recovery_definition:
    enabled: false

reporting:
  output_dir_template: "runs/{suite.name}/{task_id}/{model_id}/{track_id}/seed_{seed}/scenario_{scenario_id}"
  artifacts:
    - "config_snapshot.yaml"
    - "run_plan.json"
    - "budget_ledger.json"
    - "checkpoints/model.pt"
    - "metrics.json"
    - "metrics_step.csv"
    - "timing.csv"
  tables:
    summary_csv: "reports/summary_basilisk_spike_ra_phase_a_event_best_eval.csv"
