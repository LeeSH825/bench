suite:
  # Reuse the Phase-A suite identity so bench_generated resolves the exact
  # same deterministic train/validation/test trajectories.
  name: basilisk_spike_ra_phase_a_event
  version: "0.1.0"
  description: >
    Legacy Euclidean 6D-observation event-only Stage 2 diagnostic for
    SpikeRA-KalmanNet; this is not current right-local Phase 2 evidence. The
    original Split-KalmanNet G1/G2 modules require the Phase A producer suite's
    best checkpoint and are then frozen; a clean clone must run that producer
    first because checkpoints are not packaged.

seeds: [0]

tasks:
  - task_id: Basilisk_IMU_ADCS_event_spike_ra_phase_a_event_v0
    task_name: "Basilisk IMU ADCS Measurement Event SpikeRA Phase A"
    task_family: basilisk_imu_adcs_v0
    system_type: nonlinear
    x_dim: 6
    y_dim: 6
    sequence_length_T: 200
    dataset_sizes: {N_train: 100, N_val: 20, N_test: 20}
    simulation:
      dt: 0.1
      inertia: [10.0, 8.0, 6.0]
      disturbance_torque: [0.0, 0.0, 0.0]
      sigma0_std: 0.05
      sigma0_max_norm: 0.25
      omega0_std: 0.01
    noise:
      Q: {type: "scaled_identity", q2: 1.0e-8}
    observation:
      type: basilisk_imu_sensor
      h_type: imu_sensor_packet
      measurement_mode: gyro_delta_angle
    imu:
      measurement_mode: gyro_delta_angle
      gyro_noise_std: 2.0e-4
      accel_noise_std: 0.0
      gyro_bias_std: 0.0
      accel_bias_std: 0.0
      sensor_pos_B: [0.0, 0.0, 0.0]
      body_to_platform_euler321_rad: [0.0, 0.0, 0.0]
    event_disturbance:
      enabled: true
      event_start_frac: 0.45
      event_duration_frac: 0.10
      gyro_noise_scale_event: 10.0
      gyro_bias_jump_std: 0.01
      event_type: measurement_gyro_bias_jump
    control_input_u: false
    ground_truth: {has_gt: true}
    sweep: {}

models:
  - model_id: spike_ra_knet
    display_name: "SpikeRA-KalmanNet Stage 2"
    adapter: "bench.models.spike_ra_knet:SpikeRAKNetAdapter"
    repo: {path: "third_party/Split_KalmanNet"}
    estimator_class_path: "GSSFiltering.filtering.Split_KalmanNet_Filter"
    input_layout: "BTD"
    batch_size: 10
    weight_decay: 0.0
    val_eval_interval_updates: 25
    train_diagnostics_every: 1
    train_init_from_gt: true
    eval_init_from_gt: false
    gradient_clip_norm: 10.0
    snn_hidden_dim: 32
    lif_beta: 0.9
    lif_threshold: 1.0
    surrogate_alpha: 10.0
    ra_max_suppression: 0.5
    ra_initial_alpha: 0.99
    adapter_only_train: true
    freeze_base: true
    adapter_lr: 1.0e-4
    event_loss_lambda: 4.0
    detach_recurrent_state: true
    # Clean-clone prerequisite: first run
    # suite_basilisk_spike_ra_phase_a_event.yaml with trained:frozen.
    init_from_split_knet_checkpoint: "runs/basilisk_spike_ra_phase_a_event/Basilisk_IMU_ADCS_event_spike_ra_phase_a_event_v0/split_knet/frozen/seed_0/scenario_b93d070d887d/checkpoints/model.pt"
    capabilities:
      supports_adaptation: false
      outputs_covariance: false
      needs_system_model: true

runner:
  device: "cpu"
  precision: "fp32"
  deterministic: true
  enabled_policy:
    task_default: true
    model_default: true
    skip_if_disabled: true
  data_mode: "bench_generated"
  model_cache_dir: "runs/_model_cache/basilisk_spike_ra_stage2_event"
  budget:
    train_max_updates: 200
    train_batch_size: 10
    eval_batch_size: 20
  early_stopping:
    monitor: "val/mse_db"
    mode: "min"
    patience_evals: 0
    min_delta: 0.0
  tracks:
    - track_id: frozen
      adaptation_enabled: false

metrics:
  list: ["mse", "rmse", "mse_db", "timing_ms_per_step", "nll"]
  nll_policy:
    if_no_covariance: "NA"
  shift_recovery_definition:
    enabled: false

reporting:
  output_dir_template: "runs/basilisk_spike_ra_stage2_event/{task_id}/{model_id}/{track_id}/seed_{seed}/scenario_{scenario_id}"
  artifacts:
    - "config_snapshot.yaml"
    - "run_plan.json"
    - "budget_ledger.json"
    - "checkpoints/model.pt"
    - "checkpoints/train_state.json"
    - "diagnostics/training_diagnostics.csv"
    - "diagnostics/spike_ra_gate_trace.csv"
    - "metrics.json"
    - "metrics_step.csv"
    - "timing.csv"
  tables:
    summary_csv: "reports/summary_basilisk_spike_ra_stage2_event.csv"
