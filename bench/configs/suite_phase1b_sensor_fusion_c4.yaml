experiment_version: p1b-sensor-fusion-c4-v1
scope: representative-normalized-rigid-body-sensor-fusion

fusion:
  truth_source: basilisk
  generator_id: basilisk-sensor-fusion-regimes-v1
  num_trajectories: 84
  duration_s: 30.0
  master_seed: 20260852
  gyro_rate_hz: 10
  magnetometer_rate_hz: 5
  sun_sensor_rate_hz: 2
  star_tracker_rate_hz: 1
  initial_attitude_max_rad: 0.5
  angular_rate_max_rad_s: 0.12
  gyro_bias_max_rad_s: 0.004
  gyro_noise_std_rad_s: 0.0005
  star_tracker_R_rad2:
    - [0.00000225, 0.0, 0.0]
    - [0.0, 0.00000225, 0.0]
    - [0.0, 0.0, 0.00000225]
  magnetometer_R:
    - [0.000004, 0.0, 0.0]
    - [0.0, 0.000004, 0.0]
    - [0.0, 0.0, 0.000004]
  sun_tangent_R_rad2:
    - [0.000009, 0.0]
    - [0.0, 0.000009]
  magnetic_reference_profile: normalized-magnetic-reference-v1
  sun_reference_profile: normalized-sun-reference-v1
  sun_validity_profile: deterministic-fov-eclipselike-v1
  valid_reference_separation_deg: [20.0, 160.0]
  train_fraction: 0.2
  val_fraction: 0.2
  test_fraction: 0.6

filter:
  bias_psd_rad2_s3: 0.000000000001
  fixed_primary: F-BASE
  frozen_sensitivity:
    policy_id: F-TUNED
    s_Qg: 0.125
    s_Qb: 0.125
    s_R_ST: 8.0

c4:
  alpha_b: 100000.0
  alpha_R_mag: 16.0
  slow_window_fraction: [0.2, 0.8]
  fast_window_fraction: [0.45, 0.6]
  process_event: gyro-bias-random-walk-intensity
  measurement_event: magnetometer-inlier-gaussian-covariance

pilot:
  required_test_trajectories_per_condition: 50
  ablation_trajectories: 20

metrics:
  divergence_threshold_rad: 0.75
  recovery_absolute_floor_rad: 0.003
  recovery_multiplier: 1.2
  recovery_sustained_samples: 3

statistics:
  bootstrap_resamples: 2000
  bootstrap_seed: 20260862
  confidence_level: 0.95

exit:
  stationary_max_divergence_count: 0
  required_primary_N: 50
  require_same_realization: true
  require_sensor_nis: true
  require_all_regressions: true
  oracle_practical_improvement_fraction: 0.02

paths:
  results_root: experiments/phase1b/results/sensor_fusion_c4_v1
  manifests_root: experiments/phase1b/manifests/sensor_fusion_c4_v1
