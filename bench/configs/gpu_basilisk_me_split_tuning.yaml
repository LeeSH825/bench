suite:
  name: gpu_basilisk_me_split_tuning
  version: "0.1.0"
  description: >
    GPU tuning sweep for Measurement-Enhanced Split-KalmanNet v0 safety
    controls on real Basilisk ADCS sensor-noise severities.

seeds: [0]

tasks:
  - task_id: Basilisk_ADCS_sensor_noise_sweep_v0
    task_name: "Basilisk ADCS Sensor Noise ME-Split Tuning"
    task_family: basilisk_adcs_v0
    system_type: nonlinear
    x_dim: 6
    y_dim: 6
    sequence_length_T: 100
    dataset_sizes:
      N_train: 256
      N_val: 64
      N_test: 64
    simulation:
      dt: 0.1
      inertia: [10.0, 8.0, 6.0]
      disturbance_torque: [0.0, 0.0, 0.0]
      sigma0_std: 0.05
      sigma0_max_norm: 0.25
      omega0_std: 0.01
    noise:
      Q: { type: "scaled_identity", q2: 1.0e-8 }
      R: { type: "scaled_identity", r2: 1.0e-4 }
    observation:
      type: full_state_adcs
      h_type: direct_sigma_omega
      H: identity
    control_input_u: false
    ground_truth:
      has_gt: true
    sweep:
      sensor_noise_scale_db: [0, 20, 30]

models:
  - model_id: split_knet
    display_name: "Split-KalmanNet"
    adapter: "bench.models.split_knet:SplitKNetAdapter"
    repo:
      path: "third_party/Split_KalmanNet"
    estimator_class_path: "GSSFiltering.filtering.Split_KalmanNet_Filter"
    input_layout: "BTD"
    batch_size: 4
    lr: 1.0e-3
    weight_decay: 0.0
    val_eval_interval_updates: 100
    train_init_from_gt: true
    eval_init_from_gt: false
    capabilities:
      supports_adaptation: false
      outputs_covariance: false
      needs_system_model: true

  - &me_base
    model_id: me_split_knet_v0_ds100
    display_name: "ME-Split v0 baseline ds1"
    adapter: "bench.models.me_split_knet:MESplitKNetV0Adapter"
    repo:
      path: "third_party/Split_KalmanNet"
    estimator_class_path: "GSSFiltering.filtering.Split_KalmanNet_Filter"
    input_layout: "BTD"
    batch_size: 4
    lr: 1.0e-3
    weight_decay: 0.0
    val_eval_interval_updates: 100
    train_init_from_gt: true
    eval_init_from_gt: false
    tuning_setting: "A_baseline_old"
    enhancer_hidden_dim: 64
    enhancer_num_layers: 2
    enhancer_kernel_size: 3
    enhancer_dropout: 0.0
    enhancer_pretrain_updates: 100
    enhancer_lr: 1.0e-3
    delta_scale: 1.0
    delta_clip_ratio:
    delta_clip_abs:
    lambda_delta: 1.0e-3
    lambda_smooth: 1.0e-3
    lambda_identity: 0.0
    capabilities:
      supports_adaptation: false
      outputs_covariance: false
      needs_system_model: true

  - <<: *me_base
    model_id: me_split_knet_v0_ds025
    display_name: "ME-Split v0 weak correction"
    tuning_setting: "B_weak_correction"
    delta_scale: 0.25
    lambda_delta: 1.0e-2
    lambda_smooth: 1.0e-2

  - <<: *me_base
    model_id: me_split_knet_v0_ds010
    display_name: "ME-Split v0 very weak correction"
    tuning_setting: "C_very_weak_correction"
    delta_scale: 0.1
    lambda_delta: 1.0e-2
    lambda_smooth: 1.0e-2

  - <<: *me_base
    model_id: me_split_knet_v0_small
    display_name: "ME-Split v0 small enhancer"
    tuning_setting: "D_small_enhancer"
    delta_scale: 0.25
    enhancer_hidden_dim: 32
    enhancer_num_layers: 1
    lambda_delta: 1.0e-2
    lambda_smooth: 1.0e-2

  - <<: *me_base
    model_id: me_split_knet_v0_regstrong
    display_name: "ME-Split v0 strong regularization"
    tuning_setting: "E_strong_regularization"
    delta_scale: 0.25
    enhancer_hidden_dim: 32
    enhancer_num_layers: 1
    lambda_delta: 1.0e-1
    lambda_smooth: 1.0e-1

  - <<: *me_base
    model_id: me_split_knet_v0_clip025
    display_name: "ME-Split v0 clipped correction"
    tuning_setting: "F_clipped_correction"
    delta_scale: 0.25
    delta_clip_ratio: 0.25
    lambda_delta: 1.0e-2
    lambda_smooth: 1.0e-2

runner:
  device: "cuda"
  precision: "fp32"
  deterministic: true
  enabled_policy:
    task_default: true
    model_default: true
    skip_if_disabled: true
  data_mode: "bench_generated"
  model_cache_dir: "runs/_model_cache/gpu_basilisk_me_split_tuning"
  budget:
    train_max_updates: 500
    train_batch_size: 8
    eval_batch_size: 16
  early_stopping:
    monitor: "val/mse_db"
    mode: "min"
    patience_evals: 3
    min_delta: 0.0
  tracks:
    - track_id: frozen
      adaptation_enabled: false

metrics:
  list: ["mse", "rmse", "mse_db", "timing_ms_per_step", "nll", "shift_recovery_k"]
  nll_policy:
    if_no_covariance: "NA"
  shift_recovery_definition:
    window_W: 8
    tolerance_eps: 0.05
    metric: "mse"
    aggregation: "mean_over_window"

reporting:
  output_dir_template: "runs/{suite.name}/{task_id}/{model_id}/{track_id}/seed_{seed}/scenario_{scenario_id}"
  artifacts:
    - "config_snapshot.yaml"
    - "run_plan.json"
    - "budget_ledger.json"
    - "checkpoints/model.pt"
    - "checkpoints/train_state.json"
    - "metrics.json"
    - "metrics_step.csv"
    - "timing.csv"
    - "stdout.log"
    - "stderr.log"
    - "env.txt"
    - "git_versions.txt"
  tables:
    summary_csv: "reports/summary_gpu_basilisk_me_split_tuning.csv"
