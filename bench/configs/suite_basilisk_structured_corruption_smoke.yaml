suite:
  name: basilisk_structured_corruption_smoke
  version: "0.1.0"
  description: >
    CPU smoke suite for structured low-cost-sensor corruption on real
    AVS Basilisk ADCS full-state measurements.

seeds: [0]

tasks:
  - task_id: Basilisk_ADCS_structured_corruption_v0
    task_name: "Basilisk ADCS Structured Corruption Smoke"
    task_family: basilisk_adcs_v0
    system_type: nonlinear
    x_dim: 6
    y_dim: 6
    sequence_length_T: 50
    dataset_sizes:
      N_train: 32
      N_val: 8
      N_test: 8
    simulation:
      dt: 0.1
      inertia: [10.0, 8.0, 6.0]
      disturbance_torque: [0.0, 0.0, 0.0]
      sigma0_std: 0.05
      sigma0_max_norm: 0.25
      omega0_std: 0.01
    noise:
      Q: { type: "scaled_identity", q2: 1.0e-8 }
      R: { type: "scaled_identity", r2: 1.0e-4 }
    observation:
      type: full_state_adcs
      h_type: direct_sigma_omega
      H: identity
    control_input_u: false
    ground_truth:
      has_gt: true
    measurement_corruption:
      enabled: true
      profile_id: mild
      profiles:
        mild:
          severity: mild
          gaussian: { enabled: true, r2: 1.0e-4 }
          bias: { sigma_std: 0.002, omega_std: 0.0005 }
          random_walk: { sigma_std: 1.0e-5, omega_std: 1.0e-6 }
          scale: { std: 0.005 }
          axis_misalignment: { std: 0.002 }
          outlier: { prob: 0.001, sigma_std: 0.02, omega_std: 0.005 }
          vibration: { sigma_std: 0.002, omega_std: 0.0005, freq_hz_range: [1.0, 5.0] }
    sweep: {}

models:
  - model_id: split_knet
    display_name: "Split-KalmanNet"
    adapter: "bench.models.split_knet:SplitKNetAdapter"
    repo:
      path: "third_party/Split_KalmanNet"
    estimator_class_path: "GSSFiltering.filtering.Split_KalmanNet_Filter"
    input_layout: "BTD"
    batch_size: 4
    lr: 1.0e-3
    weight_decay: 0.0
    val_eval_interval_updates: 10
    train_init_from_gt: true
    eval_init_from_gt: false
    capabilities:
      supports_adaptation: false
      outputs_covariance: false
      needs_system_model: true

  - model_id: me_split_knet_v0
    display_name: "ME-Split-KalmanNet v0"
    adapter: "bench.models.me_split_knet:MESplitKNetV0Adapter"
    repo:
      path: "third_party/Split_KalmanNet"
    estimator_class_path: "GSSFiltering.filtering.Split_KalmanNet_Filter"
    input_layout: "BTD"
    batch_size: 4
    lr: 1.0e-3
    weight_decay: 0.0
    val_eval_interval_updates: 10
    train_init_from_gt: true
    eval_init_from_gt: false
    enhancer_hidden_dim: 64
    enhancer_num_layers: 2
    enhancer_kernel_size: 3
    enhancer_dropout: 0.0
    enhancer_pretrain_updates: 25
    enhancer_lr: 1.0e-3
    tuning_setting: "F_clipped_correction"
    delta_scale: 0.25
    delta_clip_ratio: 0.25
    delta_clip_abs:
    lambda_delta: 1.0e-2
    lambda_smooth: 1.0e-2
    lambda_identity: 0.0
    capabilities:
      supports_adaptation: false
      outputs_covariance: false
      needs_system_model: true

runner:
  device: "cpu"
  precision: "fp32"
  deterministic: true
  enabled_policy:
    task_default: true
    model_default: true
    skip_if_disabled: true
  data_mode: "bench_generated"
  model_cache_dir: "runs/_model_cache/basilisk_structured_corruption_smoke"
  budget:
    train_max_updates: 100
    train_batch_size: 8
    eval_batch_size: 8
  early_stopping:
    monitor: "val/mse_db"
    mode: "min"
    patience_evals: 2
    min_delta: 0.0
  tracks:
    - track_id: frozen
      adaptation_enabled: false

metrics:
  list: ["mse", "rmse", "mse_db", "timing_ms_per_step", "nll", "shift_recovery_k"]
  nll_policy:
    if_no_covariance: "NA"
  shift_recovery_definition:
    window_W: 8
    tolerance_eps: 0.05
    metric: "mse"
    aggregation: "mean_over_window"

reporting:
  output_dir_template: "runs/{suite.name}/{task_id}/{model_id}/{track_id}/seed_{seed}/scenario_{scenario_id}"
  artifacts:
    - "config_snapshot.yaml"
    - "run_plan.json"
    - "budget_ledger.json"
    - "checkpoints/model.pt"
    - "checkpoints/train_state.json"
    - "metrics.json"
    - "metrics_step.csv"
    - "timing.csv"
    - "stdout.log"
    - "stderr.log"
    - "env.txt"
    - "git_versions.txt"
  tables:
    summary_csv: "reports/summary_basilisk_structured_corruption_smoke.csv"
