[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bench"
version = "0.1.0"
description = "Reproducible benchmarking and ADCS research toolkit for KalmanNet-family estimators."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
  # Bench-common deps (MVP)
  "numpy>=1.23",
  "scipy>=1.9",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "torch>=2.5.1",
]

# NOTE:
# - Model/repo-specific deps should be added later as optional extras
#   after third_party repos are actually attached (Step 4+).
# - Torch is intentionally kept minimal here because CUDA wheels vary by environment.
#   Install torch separately (see README), or pin it via requirements.lock.

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
  "pytest>=7.4",
]
viz = [
  "streamlit>=1.60,<2",
  "plotly>=6.9,<7",
]
# Control plane: run registry, worker supervision, read-only API and Dash
# dashboard (bench.control / bench.ui). Kept as an extra so the training
# environment is not forced to carry a web stack.
#
# psutil and nvidia-ml-py are optional at runtime: without them CPU and GPU
# telemetry report themselves unavailable rather than failing a run.
control = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "dash>=2.17,<4",
  "plotly>=6.9,<7",
  "pydantic>=2",
  "psutil>=5.9",
  "nvidia-ml-py>=12",
]
basilisk = [
  "bsk>=2.10.2,<3",
]
research = [
  "jsonschema>=4.18",
]

# placeholders for later separation (Step 4+)
kalmannet_tsp = []
adaptive_knet = []
maml_knet = []
split_knet = []
my_model = []

[project.scripts]
bench-smoke-data = "bench.tasks.smoke_data:main"
bench-run-suite = "bench.runners.run_suite:main"
bench-make-report = "bench.reports.make_report:main"
bench-control = "bench.control.cli:main"
bench-control-api = "bench.control.api.app:main"
bench-dashboard = "bench.ui.dash_app:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["bench", "bench.*", "viz", "viz.*"]
exclude = ["bench.__pycache__*", "bench.*.__pycache__*", "viz.__pycache__*", "viz.*.__pycache__*"]
namespaces = true

[tool.setuptools.package-data]
bench = ["configs/*.yaml"]

[tool.pytest.ini_options]
# Bare `pytest` from the repo root otherwise descends into third_party/ and
# collects upstream helper scripts named *_test.py, which fail to import
# because they expect their own repo root on sys.path. Those are not our tests
# and we do not modify vendored code, so they are excluded from collection.
testpaths = ["bench/tests", "tests"]
norecursedirs = [
  "third_party",
  ".venv",
  ".basilisk_deps",
  "runs",
  "reports",
  "bench_data_cache",
  "control",
  "plots",
  "logs",
  "*.egg-info",
]
