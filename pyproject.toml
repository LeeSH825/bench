[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bench"
version = "0.1.0"
description = "Research benchmarking scaffold for KalmanNet-family models (Step 0–)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

dependencies = [
  # Bench-common deps (MVP)
  "numpy>=1.23",
  "scipy>=1.9",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "torch>=2.5.1",
]

# NOTE:
# - Model/repo-specific deps should be added later as optional extras
#   after third_party repos are actually attached (Step 4+).
# - Torch is intentionally kept minimal here because CUDA wheels vary by environment.
#   Install torch separately (see README), or pin it via requirements.lock.

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
  "pytest>=7.4",
]
viz = [
  "streamlit>=1.60,<2",
  "plotly>=6.9,<7",
]
# Control plane: run registry, worker supervision, read-only API and Dash
# dashboard (bench.control / bench.ui). Kept as an extra so the training
# environment is not forced to carry a web stack.
#
# psutil and nvidia-ml-py are optional at runtime: without them CPU and GPU
# telemetry report themselves unavailable rather than failing a run.
control = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "dash>=2.17,<4",
  "plotly>=6.9,<7",
  "pydantic>=2",
  "psutil>=5.9",
  "nvidia-ml-py>=12",
]
basilisk = [
  "bsk>=2.10.2,<3",
]

# placeholders for later separation (Step 4+)
kalmannet_tsp = []
adaptive_knet = []
maml_knet = []
split_knet = []
my_model = []

[tool.setuptools]
packages = ["bench"]

[tool.pytest.ini_options]
# Bare `pytest` from the repo root otherwise descends into third_party/ and
# collects upstream helper scripts named *_test.py, which fail to import
# because they expect their own repo root on sys.path. Those are not our tests
# and we do not modify vendored code, so they are excluded from collection.
testpaths = ["bench/tests", "tests"]
norecursedirs = [
  "third_party",
  ".venv",
  ".basilisk_deps",
  "runs",
  "reports",
  "bench_data_cache",
  "control",
  "plots",
  "logs",
  "*.egg-info",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
