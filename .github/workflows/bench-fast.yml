name: bench-fast

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  cpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,control]'
      - name: Verify clean wheel and installed CLIs
        run: python scripts/verify_clean_wheel.py
      - name: Run CPU smoke suite
        env:
          BENCH_DATA_CACHE: ${{ github.workspace }}/bench_data_cache
        run: |
          python -m bench.tests.run_all --device cpu
      - name: Run bounded ADCS replay and Vizard regressions
        run: python -m bench.tests.adcs_replay_ci
      - name: Run bounded legacy Spike contract regressions
        run: python -m unittest bench.tests.test_legacy_spike_contract
