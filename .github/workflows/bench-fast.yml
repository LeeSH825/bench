name: bench-fast

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  cpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          pip install -e '.[dev,control,viz]'
      - name: Verify clean wheel and installed CLIs
        run: python scripts/verify_clean_wheel.py
      - name: Run CPU smoke suite
        env:
          BENCH_DATA_CACHE: ${{ github.workspace }}/bench_data_cache
        run: |
          python -m bench.tests.run_all --device cpu
      - name: Run bounded ADCS replay and Vizard regressions
        run: python -m bench.tests.adcs_replay_ci
      - name: Run bounded legacy Spike contract regressions
        run: python -m unittest bench.tests.test_legacy_spike_contract
      - name: Run control and Run Inspector regressions
        run: |
          python -m pytest -q tests/test_control*.py
          python -m pytest -q tests/test_viz*.py

  frozen-basilisk-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          # Frozen generator provenance asserts this exact interpreter patch.
          python-version: "3.10.13"
      - name: Install full frozen test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          pip install -e '.[dev,control,viz,basilisk]'
      - name: Run the complete test suite
        env:
          BENCH_DATA_CACHE: ${{ github.workspace }}/bench_data_cache
          MPLBACKEND: Agg
        run: python -m pytest -q
